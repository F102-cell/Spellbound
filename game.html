                ctx.restore();

                const modelKey = this.model.toLowerCase();
                const healthBarWidth = modelKey === 'king' ? 56 : 28;
                const healthBarHeightMultiplier = {
                    king: 1.75,
                    champion: 1.45,
                    knight: 1.35,
                    alien: 1.35,
                    ultron: 1.3,
                    thanos: 1.3,
                    siege: 1.25
                }[modelKey] ?? 1;
                const healthBarY = this.y - this.radius * healthBarHeightMultiplier - 14;
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(this.x - healthBarWidth / 2, healthBarY, healthBarWidth, 4);
                ctx.fillStyle = "#22c55e";
                ctx.fillRect(this.x - healthBarWidth / 2, healthBarY, (this.hp / this.maxHp) * healthBarWidth, 4);
            }
        }

        class DefenseStructure {
            constructor(type, x, y) {
                this.type = type;
                this.x = x; this.y = y;
                this.lastShot = 0;
                this.enemiesPassed = 0;
                this.broken = false;
                this.pulse = 0;

                if (type === 'bushes') this.radius = 32;
                else if (type === 'archers') { this.radius = 18; this.baseRange = 160; this.baseCooldown = 200; this.baseDamage = 1; }
                else if (type === 'bank') this.radius = 20;
                else if (type === 'catapult') { this.radius = 20; this.baseRange = 320; this.baseCooldown = 1300; this.baseDamage = 110; }
                else if (type === 'gas') { this.radius = 20; this.baseRange = 240; this.baseCooldown = 1800; this.baseDamage = 12; }
                }

            update() {
                if (this.broken) return;
                this.pulse += 0.05;

                if (this.baseRange !== undefined) {
                    this.range = this.baseRange + getSkillEffect('towerRange');
                    this.cooldown = this.baseCooldown / (1 + getSkillEffect('towerSpeed'));
                    this.dmg = this.baseDamage * (1 + getSkillEffect('towerDamage'));
                }

                const now = Date.now();
                if (this.type === 'archers') {
                    if (now - this.lastShot > this.cooldown) {
                        let target = null, minDst = this.range;
                        enemies.forEach(e => {
                            let d = Math.hypot(e.x - this.x, e.y - this.y);
                            if (d < minDst) { minDst = d; target = e; }
                        });
                        if (target) {
                            this.lastShot = now;
                            target.hp -= this.dmg;
                            createExplosion(target.x, target.y, "#cbd5e1", 3);
                            checkEnemyDeath(target);
                        }
                    }
                } else if (this.type === 'catapult') {
                    if (now - this.lastShot > this.cooldown) {
                        let target = null, minDst = this.range;
                        enemies.forEach(e => {
                            let d = Math.hypot(e.x - this.x, e.y - this.y);
                            if (d < minDst) { minDst = d; target = e; }
                        });
                        if (target) {
                            this.lastShot = now;
                            projectiles.push({
                                x: this.x, y: this.y,
                                targetX: target.x, targetY: target.y,
                                speed: 6, isCatapultBoulder: true,
                                splashRadius: 80, damage: this.dmg
                            });
                        }
                    }
                } else if (this.type === 'gas') {
                    if (now - this.lastShot > this.cooldown) {
                        let target = null, minDst = this.range;
                        enemies.forEach(e => {
                            let d = Math.hypot(e.x - this.x, e.y - this.y);
                            if (d < minDst) { minDst = d; target = e; }
                        });
                        if (target) {
                            this.lastShot = now;
                            projectiles.push({
                                x: this.x, y: this.y,
                                targetX: target.x, targetY: target.y,
                                speed: 5, isGasCanister: true,
                                splashRadius: 72, damage: this.dmg
                            });
                        }
                    }
                }
            }

            draw() {
                if (this.broken) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'bushes') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(16, 185, 129, 0.4)";
                    ctx.fill();
                    ctx.lineWidth = 2; ctx.strokeStyle = "#047857";
                    ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                } else if (this.type === 'archers') {
                    ctx.fillStyle = "#78716c";
                    ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                    ctx.strokeStyle = "#d6d3d1"; ctx.lineWidth = 2;
                    ctx.strokeRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                    ctx.fillStyle = "#fbbf24";
                    ctx.fillRect(-4, -4, 8, 8);
                } else if (this.type === 'bank') {
                    ctx.beginPath();
                    ctx.arc(0, Math.sin(this.pulse) * 2, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = "#b45309"; ctx.fill();
                    ctx.lineWidth = 2; ctx.strokeStyle = "#f59e0b"; ctx.stroke();
                } else if (this.type === 'catapult') {
                    ctx.fillStyle = "#44403c";
                    ctx.fillRect(-14, -14, 28, 28);
                    ctx.strokeStyle = "#a8a29e"; ctx.lineWidth = 2;
                    ctx.strokeRect(-14, -14, 28, 28);
                    ctx.fillStyle = "#78716c";
                    ctx.fillRect(-4, -18, 8, 20);
                } else if (this.type === 'gas') {
                    ctx.fillStyle = "#365314";
                    ctx.fillRect(-14, -14, 28, 28);
                    ctx.strokeStyle = "#a3e635"; ctx.lineWidth = 2;
                    ctx.strokeRect(-14, -14, 28, 28);
                    ctx.fillStyle = "#84cc16";
                    ctx.beginPath();
                    ctx.arc(0, -2, 7 + Math.sin(this.pulse * 2) * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.size = Math.random() * 4 + 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 25;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life--; }
            draw() { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); }
        }

        function createExplosion(x, y, color, count = 6) {
            for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
        }

        function applyPlayerDamage(damage) {
            const damageMultiplier = Math.max(0, 1 - getSkillEffect('damageReduction'));
            player.hp -= damage * damageMultiplier;
            playSoundEffect(110, 0.16, 0.09, "sawtooth");
            if (player.hp <= 0) {
                gameState = 'GAMEOVER';
                runTimerActive = false;
            }
        }
        function applyPlayerSkillBurst() {
            if (player.skills.spellBurst.rank > 0) {
                const burstMultiplier = 1 + player.skills.spellBurst.rank * 1.0;
                player.mana *= burstMultiplier;
            }
        }

        function openMilestoneReward(resumeState) {
            if (gameState === 'MILESTONE_REWARD') return;
            if (gameMode !== 'arcade') milestoneRewardClaimed = true;
            milestoneRewardResumeState = resumeState;
            gameState = 'MILESTONE_REWARD';
        }

        function chooseMilestoneReward(reward) {
            if (reward === 'sidekick') sidekickUnlocked = true;
            else if (reward === 'gold') player.gold += 1000;
            else if (reward === 'shield') projectileShieldRemainingMs = projectileShieldDurationMs;
            else if (reward === 'mapSize') {
                mapExpansionLevel++;
                canvas.width = Math.round(initialMapWidth * Math.pow(mapExpansionFactor, mapExpansionLevel));
                canvas.height = Math.round(initialMapHeight * Math.pow(mapExpansionFactor, mapExpansionLevel));
            }
            gameState = milestoneRewardResumeState;
        }

        function getEnemyCountMultiplier() {
            return Math.pow(mapExpansionFactor, mapExpansionLevel);
        }

        function checkEnemyDeath(enemy) {
            if (enemy.hp <= 0) {
                let idx = enemies.indexOf(enemy);
                if (idx > -1) {
                    enemies.splice(idx, 1);
                    score += 100;
                    let goldReward = (enemyKillGoldRewards[enemy.model] ?? 10) + getSkillEffect('goldPerKill');
                    player.gold += goldReward;
                    playSoundEffect(enemy.model === "king" || enemy.model === "champion" ? 220 : 330,
                        enemy.model === "king" || enemy.model === "champion" ? 0.25 : 0.06,
                        0.07, "triangle");
                    if (gameMode === 'arcade' && Math.random() < 0.1) {
                        healthOranges.push({ x: enemy.x, y: enemy.y, remainingMs: 15000 });
                    }
                }
            }
        }

        function startNewGame() {
            runElapsedMs = 0;
            runTimerActive = true;
            player.hp = 100; player.maxHp = 100; player.mana = 100;
            player.gold = 500;
            player.mana = 100; player.maxMana = 100;
            Object.values(player.skills).forEach(skill => {
                skill.rank = 0;
            });
            unlockedSkillTiers = { 1: true, 2: false, 3: false };
            selectedSkillTier = 1;
            milestoneRewardClaimed = false;
            sidekickUnlocked = false;
            mapExpansionLevel = 0;
            canvas.width = initialMapWidth;
            canvas.height = initialMapHeight;
            projectileShieldRemainingMs = 0;
            score = 0; currentRound = 1;
            maxRounds = difficultySettings[difficulty].maxRounds;
            projectiles = []; gasClouds = []; healthOranges = []; enemies = []; particles = []; defenses = [];
            pendingPlayerShots = [];
            skillTreeScrollY = 0;
            arcadeElapsedMs = 0;
            arcadeSpawnTimerMs = 0;
            arcadeNextKingMs = arcadeKingIntervalMs;
            arcadeNextChampionMs = arcadeChampionIntervalMs;
            arcadeNextMilestoneRewardMs = arcadeChampionIntervalMs;
            if (gameMode === 'arcade') {
                waveActive = false;
                enemiesRemainingInWave = 0;
            } else {
                initRound();
            }
            gameState = 'PLAYING';
            showBuildModal = false;
        }

        function initRound() {
            intermissionFrames = 0;
            waveActive = true;
            enemiesRemainingInWave = Math.ceil(
                (5 + (currentRound * 3)) * difficultySettings[difficulty].waveSize * getEnemyCountMultiplier()
            );
            kingSpawnedThisWave = false;
            championSpawnedThisWave = false;
            waveTimer = 0;
        }

        window.addEventListener("keydown", (e) => {
            let k = e.key.toLowerCase();
            if (!isTextEntryTarget(e.target) && gameState === 'PLAYING') {
                if (k === keybinds.spell1) currentSpellKey = "1";
                if (k === keybinds.spell2) currentSpellKey = "2";
                if (k === keybinds.spell3) currentSpellKey = "3";
                if (k === keybinds.spell4) currentSpellKey = "4";
                if (k === keybinds.spell5) currentSpellKey = "5";
            }
        });

        function updateGame(deltaTime) {
            animTimer += 0.05;
            projectileShieldRemainingMs = Math.max(0, projectileShieldRemainingMs - deltaTime);

            let currentSpeed = player.speed + getSkillEffect('movementSpeed');
            let dx = 0, dy = 0;
            if (keys[keybinds.up]) dy -= 1;
            if (keys[keybinds.down]) dy += 1;
            if (keys[keybinds.left]) dx -= 1;
            if (keys[keybinds.right]) dx += 1;
            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

            player.x += dx * currentSpeed;
            player.y += dy * currentSpeed;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            let regenRate = 0.3 + getSkillEffect('manaRegen');
            if (player.mana < player.maxMana) player.mana = Math.min(player.maxMana, player.mana + regenRate);
            const healthRegenerationPerSecond = getSkillEffect('healthRegen');
            if (player.hp < player.maxHp && healthRegenerationPerSecond > 0) {
                player.hp = Math.min(player.maxHp,
                    player.hp + healthRegenerationPerSecond * deltaTime / 1000);
            }

            defenses.forEach(def => def.update());
            defenses = defenses.filter(def => !def.broken);

            if (gameMode === 'arcade') {
                arcadeElapsedMs += deltaTime;
                arcadeSpawnTimerMs += deltaTime;
                while (arcadeNextKingMs <= arcadeElapsedMs || arcadeNextChampionMs <= arcadeElapsedMs) {
                    if (arcadeNextKingMs <= arcadeNextChampionMs) {
                        spawnKing();
                        arcadeNextKingMs += arcadeKingIntervalMs;
                    } else {
                        if (arcadeNextChampionMs % arcadeKingIntervalMs !== 0) spawnChampion();
                        arcadeNextChampionMs += arcadeChampionIntervalMs;
                    }
                }
                if (arcadeElapsedMs >= arcadeNextMilestoneRewardMs) {
                    while (arcadeNextMilestoneRewardMs <= arcadeElapsedMs) {
                        arcadeNextMilestoneRewardMs += arcadeChampionIntervalMs;
                    }
                    openMilestoneReward('PLAYING');
                }

                const minutesSinceFirstKing = arcadeElapsedMs >= arcadeKingIntervalMs
                    ? Math.floor((arcadeElapsedMs - arcadeKingIntervalMs) / 60000)
                    : 0;
                const spawnCount = Math.ceil((5 + minutesSinceFirstKing) * getEnemyCountMultiplier());
                const spawnIntervalMs = 5000;

                if (arcadeSpawnTimerMs >= spawnIntervalMs) {
                    arcadeSpawnTimerMs %= spawnIntervalMs;
                    for (let i = 0; i < spawnCount; i++) spawnEnemyForRound();
                }
            } else if (waveActive && enemiesRemainingInWave > 0) {
                waveTimer++;
                if (waveTimer > Math.max(1, 50 - (currentRound * 3))) {
                    spawnEnemyForRound();
                    enemiesRemainingInWave--;
                    waveTimer = 0;
                }
            } else if (waveActive && enemies.length === 0 && enemiesRemainingInWave <= 0) {
                waveActive = false;
                player.hp = Math.min(player.maxHp, player.hp + 35);

                let bankMultiplier = 1.05 + getSkillEffect('bankInterest');
                let activeBanks = defenses.filter(d => d.type === 'bank' && !d.broken).length;
                let totalMult = Math.pow(bankMultiplier, activeBanks);

                let bonusGold = Math.floor(40 * totalMult);
                player.gold += bonusGold + 30;

                if (currentRound >= maxRounds) {
                    gameState = 'VICTORY';
                    runTimerActive = false;
                    if (isLeaderboardRun()) {
                        submitLeaderboardTime(Math.floor(runElapsedMs), difficulty).catch(showLeaderboardError);
                    }
                } else {
                    currentRound++;
                    intermissionFrames = 30 * 60;
                    gameState = 'INTERMISSION';
                    if (currentRound === 11 && !milestoneRewardClaimed) {
                        openMilestoneReward('INTERMISSION');
                    }
                }
            }

            const now = Date.now();
            const activeSpell = spells[currentSpellKey];
            if (mouse.down && !showBuildModal && now - lastShotTime > activeSpell.cooldown) {
                const spellDamageRank = getSkillEffect('spellDamageRank');
                let damageMultiplier = 1 + getSkillEffect('spellDamage');
                let finalDamage = activeSpell.baseDamage * damageMultiplier;

                if (player.mana >= activeSpell.manaCost) {
                    player.mana -= activeSpell.manaCost;
                    lastShotTime = now;

                    const baseAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
                    shootProjectile(baseAngle, activeSpell, finalDamage);
                    for (let rank = 1; rank <= getSkillEffect('burstShots'); rank++) {
                        pendingPlayerShots.push({
                            angle: baseAngle,
                            spell: activeSpell,
                            damage: finalDamage,
                            fireAtMs: now + rank * spellBurstDelayMs
                        });
                    }

                    if (spellDamageRank >= 3) {
                        shootProjectile(baseAngle - 0.25, activeSpell, finalDamage * 0.75);
                        shootProjectile(baseAngle + 0.25, activeSpell, finalDamage * 0.75);
                    }
                }
            }

            for (let i = pendingPlayerShots.length - 1; i >= 0; i--) {
                const shot = pendingPlayerShots[i];
                if (now >= shot.fireAtMs) {
                    shootProjectile(shot.angle, shot.spell, shot.damage);
                    pendingPlayerShots.splice(i, 1);
                }
            }

            function shootProjectile(angle, spell, dmg) {
                const speedMultiplier = 1 + getSkillEffect('spellSpeed');
                const spellFrequency = { "1": 220, "2": 520, "3": 880, "4": 330, "5": 65 }[currentSpellKey] ?? 440;
                playSoundEffect(spellFrequency, currentSpellKey === "5" ? 0.22 : 0.055,
                    currentSpellKey === "5" ? 0.1 : 0.04,
                    currentSpellKey === "5" ? "sawtooth" : "sine");
                const projectile = {
                    x: player.x, y: player.y,
                    vx: Math.cos(angle) * spell.speed * speedMultiplier,
                    vy: Math.sin(angle) * spell.speed * speedMultiplier,
                    radius: spell.radius,
                    color: spell.color,
                    damage: dmg,
                    piercesRemaining: getSkillEffect('piercingRank') > 0
                        ? Math.pow(2, getSkillEffect('piercingRank') - 1)
                        : 0,
                    hitEnemies: []
                };
                projectiles.push(projectile);
                if (sidekickUnlocked) {
                    const sidekickPosition = getSidekickPosition();
                    projectiles.push({
                        ...projectile,
                        x: sidekickPosition.x,
                        y: sidekickPosition.y,
                        hitEnemies: []
                    });
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                if (p.isEnemyGasCanister) {
                    const angle = Math.atan2(p.targetY - p.y, p.targetX - p.x);
                    p.x += Math.cos(angle) * p.speed;
                    p.y += Math.sin(angle) * p.speed;
                    if (Math.hypot(p.targetX - p.x, p.targetY - p.y) < p.speed + 1) {
                        gasClouds.push({
                            x: p.targetX, y: p.targetY, radius: p.splashRadius,
                            damage: 0, remainingMs: 4000, tickTimerMs: 0,
                            playerDamagePerSecond: p.gasDamagePerSecond,
                            playerDamageTimerMs: 0
                        });
                        createExplosion(p.targetX, p.targetY, "#84cc16", 12);
                        projectiles.splice(i, 1);
                    }
                } else if (p.isEnemyProjectile && p.isCatapultBoulder) {
                    const angle = Math.atan2(p.targetY - p.y, p.targetX - p.x);
                    p.x += Math.cos(angle) * p.speed;
                    p.y += Math.sin(angle) * p.speed;
                    if (Math.hypot(p.targetX - p.x, p.targetY - p.y) < p.speed + 1) {
                        createExplosion(p.x, p.y, p.color, 15);
                        if (projectileShieldRemainingMs <= 0 &&
                            Math.hypot(player.x - p.x, player.y - p.y) < p.splashRadius + player.radius) {
                            applyPlayerDamage(p.damage);
                        }
                        projectiles.splice(i, 1);
                    }
                } else if (p.isEnemyProjectile) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + p.radius) {
                        if (projectileShieldRemainingMs > 0) {
                            createExplosion(player.x, player.y, "#38bdf8", 4);
                        } else {
                            applyPlayerDamage(p.damage);
                            createExplosion(player.x, player.y, p.color);
                        }
                        projectiles.splice(i, 1);
                    }
                } else if (p.isCatapultBoulder) {
                    let angle = Math.atan2(p.targetY - p.y, p.targetX - p.x);
                    p.x += Math.cos(angle) * p.speed;
                    p.y += Math.sin(angle) * p.speed;
                    if (Math.hypot(p.targetX - p.x, p.targetY - p.y) < 10) {
                        createExplosion(p.x, p.y, "#f97316", 15);
                        enemies.forEach(e => {
                            if (Math.hypot(e.x - p.x, e.y - p.y) < p.splashRadius) {
                                e.hp -= p.damage;
                                checkEnemyDeath(e);
                            }
                        });
                        projectiles.splice(i, 1);
                    }
                } else if (p.isGasCanister) {
                    const angle = Math.atan2(p.targetY - p.y, p.targetX - p.x);
                    p.x += Math.cos(angle) * p.speed;
                    p.y += Math.sin(angle) * p.speed;
                    if (Math.hypot(p.targetX - p.x, p.targetY - p.y) < p.speed + 1) {
                        gasClouds.push({
                            x: p.targetX, y: p.targetY, radius: p.splashRadius,
                            damage: p.damage, remainingMs: 4000, tickTimerMs: 0
                        });
                        createExplosion(p.targetX, p.targetY, "#84cc16", 12);
                        projectiles.splice(i, 1);
                    }
                } else {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                        projectiles.splice(i, 1);
                        continue;
                    }
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let e = enemies[j];
                        if (p.hitEnemies && p.hitEnemies.includes(e)) continue;
                        if (Math.hypot(p.x - e.x, p.y - e.y) < p.radius + e.radius) {
                            if (p.hitEnemies) p.hitEnemies.push(e);
                            e.hp -= p.damage;
                            createExplosion(e.x, e.y, p.color);
                            checkEnemyDeath(e);
                            if (p.piercesRemaining > 0) {
                                p.piercesRemaining--;
                            } else {
                                projectiles.splice(i, 1);
                            }
                            break;
                        }
                    }
                }
            }

            for (let i = gasClouds.length - 1; i >= 0; i--) {
                const cloud = gasClouds[i];
                const elapsedMs = Math.min(deltaTime, cloud.remainingMs);
                cloud.remainingMs -= deltaTime;
                cloud.tickTimerMs += elapsedMs;
                while (cloud.tickTimerMs >= 500) {
                    cloud.tickTimerMs -= 500;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        if (Math.hypot(enemy.x - cloud.x, enemy.y - cloud.y) < cloud.radius + enemy.radius) {
                            enemy.hp -= cloud.damage;
                            checkEnemyDeath(enemy);
                        }
                    }
                }
                if (cloud.playerDamagePerSecond) {
                    if (Math.hypot(player.x - cloud.x, player.y - cloud.y) < cloud.radius + player.radius) {
                        cloud.playerDamageTimerMs += elapsedMs;
                        while (cloud.playerDamageTimerMs >= 1000) {
                            cloud.playerDamageTimerMs -= 1000;
                            applyPlayerDamage(cloud.playerDamagePerSecond);
                        }
                    } else {
                        cloud.playerDamageTimerMs = 0;
                    }
                }
                if (cloud.remainingMs <= 0) gasClouds.splice(i, 1);
            }

            for (let i = healthOranges.length - 1; i >= 0; i--) {
                const orange = healthOranges[i];
                orange.remainingMs -= deltaTime;
                if (orange.remainingMs <= 0) {
                    healthOranges.splice(i, 1);
                } else if (Math.hypot(player.x - orange.x, player.y - orange.y) < player.radius + 14) {
                    player.hp = Math.min(player.maxHp, player.hp + 25);
                    healthOranges.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.update(deltaTime);

                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    e.contactDamageTimerMs = Math.max(0, e.contactDamageTimerMs - deltaTime);
                    if (e.contactDamageTimerMs === 0) {
                        applyPlayerDamage(e.contactDamage);
                        createExplosion(player.x, player.y, "#ef4444");
                        e.contactDamageTimerMs = enemyContactDamageIntervalMs;
                    }
                } else {
                    e.contactDamageTimerMs = 0;
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function drawHUD() {
            ctx.fillStyle = "#f3f4f6";
            ctx.font = "15px Georgia, serif";
            ctx.fillText(`Score: ${score}`, 20, 30);
            if (gameMode === 'arcade') {
                const elapsedSeconds = Math.floor(arcadeElapsedMs / 1000);
                const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const seconds = String(elapsedSeconds % 60).padStart(2, '0');
                const secondsToKing = Math.max(0, Math.ceil((arcadeNextKingMs - arcadeElapsedMs) / 1000));
                const kingMinutes = String(Math.floor(secondsToKing / 60)).padStart(2, '0');
                const kingSeconds = String(secondsToKing % 60).padStart(2, '0');
                ctx.fillText(`Time: ${minutes}:${seconds}`, 20, 55);
                ctx.fillText(`Next King: ${kingMinutes}:${kingSeconds}`, 20, 80);
                ctx.fillStyle = "#d4af37";
                ctx.fillText(`Gold: 🪙 ${player.gold}`, 20, 105);
                ctx.fillStyle = "#f3f4f6";
                ctx.fillText(`Spell: ${spells[currentSpellKey].name} [${currentSpellKey}]`, 20, 130);
            } else {
                ctx.fillText(`Time: ${formatElapsedTime(runElapsedMs)}`, 20, 55);
                ctx.fillText(`Round: ${currentRound} / ${maxRounds}`, 20, 80);
                ctx.fillStyle = "#d4af37";
                ctx.fillText(`Gold: 🪙 ${player.gold}`, 20, 105);
                ctx.fillStyle = "#f3f4f6";
                ctx.fillText(`Spell: ${spells[currentSpellKey].name} [${currentSpellKey}]`, 20, 130);
            }
            if (projectileShieldRemainingMs > 0) {
                ctx.fillStyle = "#38bdf8";
                ctx.fillText(`Shield: ${Math.ceil(projectileShieldRemainingMs / 1000)}s`, 20, 180);
            }

            ctx.fillStyle = "#f3f4f6"; ctx.font = "12px Georgia, serif";
            ctx.fillText(`HP: ${Math.ceil(player.hp)} / ${player.maxHp}`, 20, 644);
            ctx.fillText(`Mana: ${Math.ceil(player.mana)} / ${player.maxMana}`, 180, 644);

            ctx.fillStyle = "#27272a"; ctx.fillRect(20, 650, 150, 16);
            ctx.fillStyle = "#dc2626"; ctx.fillRect(20, 650, (player.hp / player.maxHp) * 150, 16);
            ctx.strokeStyle = "#d4af37"; ctx.strokeRect(20, 650, 150, 16);
            ctx.fillStyle = "#f3f4f6"; ctx.font = "11px Georgia, serif"; ctx.fillText("HP", 25, 662);

            ctx.fillStyle = "#27272a"; ctx.fillRect(180, 650, 150, 16);
            ctx.fillStyle = "#2563eb"; ctx.fillRect(180, 650, (player.mana / player.maxMana) * 150, 16);
            ctx.strokeStyle = "#d4af37"; ctx.strokeRect(180, 650, 150, 16);
            ctx.fillStyle = "#f3f4f6"; ctx.fillText("MANA", 185, 662);
        }

        function getSidekickPosition() {
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            return {
                x: player.x - Math.cos(angle) * 34,
                y: player.y - Math.sin(angle) * 34
            };
        }

        function drawGameScene() {
            ctx.fillStyle = "#121218";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#1f1e29"; ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            defenses.forEach(d => {
                d.draw();
                if (Math.hypot(mouse.x - d.x, mouse.y - d.y) < d.radius + 5 && (d.range || d.type === 'bushes')) {
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.range || d.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = "rgba(212, 175, 55, 0.4)";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });

            gasClouds.forEach(cloud => {
                const opacity = Math.min(0.3, cloud.remainingMs / 4000 * 0.3);
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(132, 204, 22, ${opacity})`;
                ctx.fill();
                ctx.strokeStyle = "rgba(190, 242, 100, 0.7)";
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            healthOranges.forEach(orange => {
                ctx.beginPath();
                ctx.arc(orange.x, orange.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = "#f97316";
                ctx.fill();
                ctx.strokeStyle = "#fed7aa";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.beginPath();
                ctx.ellipse(orange.x + 3, orange.y - 12, 5, 2.5, -0.5, 0, Math.PI * 2);
                ctx.fillStyle = "#65a30d";
                ctx.fill();
            });

            particles.forEach(p => p.draw());

            projectiles.forEach(p => {
                ctx.beginPath();
                if (p.isCatapultBoulder) {
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = p.color || "#f97316";
                } else if (p.isGasCanister || p.isEnemyGasCanister) {
                    ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                    ctx.fillStyle = "#84cc16";
                } else {
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                }
                ctx.shadowBlur = 10; ctx.shadowColor = p.color || "#f97316";
                ctx.fill(); ctx.shadowBlur = 0; ctx.closePath();
            });

            enemies.forEach(e => e.draw());

            if (sidekickUnlocked) {
                const sidekickPosition = getSidekickPosition();
                ctx.beginPath();
                ctx.arc(sidekickPosition.x, sidekickPosition.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = "#0e7490";
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#67e8f9";
                ctx.stroke();
                ctx.fillStyle = "#facc15";
                ctx.fillRect(sidekickPosition.x - 4, sidekickPosition.y - 14, 8, 3);
            }

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.beginPath();
            ctx.arc(0, player.radius * 0.5, player.radius * 0.8, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#4338ca"; ctx.shadowBlur = 15; ctx.shadowColor = "#6366f1";
            ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#fbbf24"; ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#fbbf24";
            ctx.fillRect(-8, -player.radius - 6, 16, 6);

            ctx.restore();

            if (projectileShieldRemainingMs > 0) {
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 9, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(56, 189, 248, 0.85)";
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            ctx.beginPath(); ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(angle) * 28, player.y + Math.sin(angle) * 28);
            ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 4; ctx.stroke(); ctx.closePath();

            drawHUD();
            if (selectedDefenseType) {
                ctx.fillStyle = "#f3f4f6";
                ctx.font = "16px Georgia, serif";
                ctx.textAlign = "center";
                ctx.fillText("Click anywhere to place the selected defense", canvas.width / 2, canvas.height - 20);
            }
            if (showBuildModal) drawBuildModal();
        }

                ctx.fillText(`${towerCount} / ${defenseLimits[opt.type]}`, bx + bw - 105, by + 35);
                ctx.fillStyle = "#f59e0b"; ctx.textAlign = "right";
                ctx.fillText(`🪙 ${opt.cost}`, bx + bw - 20, by + 35);

                if (mouse.clicked && isHover && !isMaxed) {
                    selectedDefenseType = opt.type;
                    showBuildModal = false;
                }
            });

        canvas.addEventListener("click", () => {
            if (placementClick && (gameState === 'PLAYING' || gameState === 'INTERMISSION') && selectedDefenseType && !showBuildModal) {
                let cost = defenseCosts[selectedDefenseType];
                if (getDefenseCount(selectedDefenseType) < defenseLimits[selectedDefenseType] && player.gold >= cost) {

        function getControlsMenuLayout() {
            const modalW = 600, modalH = 560;
            const mx = (canvas.width - modalW) / 2, my = (canvas.height - modalH) / 2;
            const viewport = { x: mx + 32, y: my + 75, width: modalW - 64, height: 350 };
            const rowHeight = 38;
            const contentHeight = controlDefinitions.length * rowHeight;
            const maxScroll = Math.max(0, contentHeight - viewport.height);
            controlsScrollY = Math.max(0, Math.min(maxScroll, controlsScrollY));
            const track = { x: mx + modalW - 26, y: viewport.y, width: 8, height: viewport.height };
            const thumbHeight = Math.min(track.height, Math.max(36, track.height * viewport.height / contentHeight));
            const thumbY = track.y + (maxScroll > 0
                ? (controlsScrollY / maxScroll) * (track.height - thumbHeight)
                : 0);
            return { mx, my, modalW, modalH, viewport, rowHeight, contentHeight, maxScroll, track, thumbHeight, thumbY };
        }

        function drawControlsMenu() {
            ctx.fillStyle = "rgba(9, 9, 14, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const layout = getControlsMenuLayout();
            const { mx, my, modalW, modalH, viewport } = layout;

            ctx.fillStyle = "#1e1b18"; ctx.fillRect(mx, my, modalW, modalH);
            ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 3; ctx.strokeRect(mx, my, modalW, modalH);

            let cx = mx + modalW - 30, cy = my + 30;
            ctx.fillStyle = "#991b1b"; ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "bold 14px Georgia, serif"; ctx.textAlign = "center"; ctx.fillText("X", cx, cy + 5);
            if (mouse.clicked && Math.hypot(mouse.x - cx, mouse.y - cy) < 14) {
                gameState = controlsReturnState;
            }

            ctx.textAlign = "center"; ctx.fillStyle = "#d4af37"; ctx.font = "bold 26px Georgia, serif";
            ctx.fillText("CUSTOMIZE CONTROLS", canvas.width / 2, my + 50);

            ctx.save();
            ctx.beginPath();
            ctx.rect(viewport.x, viewport.y, viewport.width, viewport.height);
            ctx.clip();
            controlDefinitions.forEach((b, idx) => {
                const by = viewport.y + 10 + (idx * layout.rowHeight) - controlsScrollY;
                let bx = mx + 350, bw = 180, bh = 30;
                if (by + bh < viewport.y || by > viewport.y + viewport.height) return;
                let isHover = mouse.x > bx && mouse.x < bx + bw && mouse.y > by && mouse.y < by + bh;

                ctx.fillStyle = "#f3f4f6"; ctx.font = "14px Georgia, serif"; ctx.textAlign = "left";
                ctx.fillText(b.label, mx + 50, by + 20);

                ctx.fillStyle = waitingForKeyRebind === b.key ? "#f59e0b" : (isHover ? "#3f3224" : "#2c2219");
                ctx.fillRect(bx, by, bw, bh);
                ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);

                ctx.fillStyle = "#fff"; ctx.textAlign = "center";
                ctx.fillText(waitingForKeyRebind === b.key ? "PRESS ANY KEY..." : keybinds[b.key].toUpperCase(), bx + bw / 2, by + 20);

                if (mouse.clicked && isHover) {
                    waitingForKeyRebind = b.key;
                }
            });
            ctx.restore();

            if (layout.maxScroll > 0) {
                ctx.fillStyle = "#2c2219";
                ctx.fillRect(layout.track.x, layout.track.y, layout.track.width, layout.track.height);
                ctx.fillStyle = "#d4af37";
                ctx.fillRect(layout.track.x, layout.thumbY, layout.track.width, layout.thumbHeight);
            }

            drawButton(canvas.width / 2 - 90, my + modalH - 50, 180, 36, "#5c4033", "#fff",
                controlsReturnState === 'PAUSED' ? "BACK TO PAUSE MENU" : "BACK TO MENU",
                () => gameState = controlsReturnState);
        }

            ctx.clip();

                const cardX = mx + 35 + col * 470;
                const cardY = viewport.y + row * rowHeight - skillTreeScrollY;
                const isVisible = cardY + cardH > viewport.y && cardY < viewport.y + viewport.height;
                if (!isVisible) return;

                const isHovered = mouse.x >= cardX && mouse.x <= cardX + cardW &&
                    mouse.y >= Math.max(cardY, viewport.y) &&
                    mouse.y <= Math.min(cardY + cardH, viewport.y + viewport.height);
                const cost = getSkillCost(skill);

                ctx.fillStyle = isHovered ? "#3f3224" : "#221e1a";
                ctx.fillRect(cardX, cardY, cardW, cardH);
                ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 2;
                ctx.strokeRect(cardX, cardY, cardW, cardH);

                ctx.textAlign = "left";
                ctx.fillStyle = "#fff"; ctx.font = "bold 15px Georgia, serif";
                ctx.fillText(skill.name, cardX + 16, cardY + 25);
                ctx.fillStyle = "#cbd5e1"; ctx.font = "12px Georgia, serif";
                ctx.fillText(skill.desc, cardX + 16, cardY + 48);
                ctx.fillStyle = "#d4af37"; ctx.font = "bold 13px Georgia, serif";
                const isMaxed = gameMode !== 'arcade' && skill.rank >= skill.maxRank;
                const maxRankLabel = gameMode === 'arcade' || skill.maxRank === Infinity
                    ? '∞'
                    : skill.maxRank;
                ctx.fillText(`Rank: ${skill.rank} / ${maxRankLabel}`, cardX + 16, cardY + 76);
                ctx.textAlign = "right";
                ctx.fillStyle = "#38bdf8";
                ctx.fillText(isMaxed ? "MAXED" : `Cost: 🪙 ${cost}`, cardX + cardW - 16, cardY + 76);

                if (mouse.clicked && isHovered && !isMaxed && player.gold >= cost) {
                    player.gold -= cost;
                    skill.rank++;
                    if (skill.effects?.maxHp) {
                        player.maxHp += skill.effects.maxHp;
                        player.hp += skill.effects.maxHp;
                    }
                    if (skill.effects?.maxMana) {
                        player.maxMana += skill.effects.maxMana;
                        player.mana += skill.effects.maxMana;
                    }
                    if (skill.effects?.heal) {
                        player.hp = Math.min(player.maxHp, player.hp + skill.effects.heal);
                    }
                    if (skill.effects?.gold) {
                        player.gold += skill.effects.gold;
                    }
                }
            });
            ctx.restore();

            ctx.fillStyle = "#27272a";
            ctx.fillRect(track.x, track.y, track.width, track.height);
            ctx.fillStyle = "#d4af37";
            ctx.fillRect(track.x, thumbY, track.width, thumbHeight);
            ctx.strokeStyle = "#fef3c7";
            ctx.strokeRect(track.x, thumbY, track.width, thumbHeight);

            drawButton(canvas.width / 2 - 90, my + modalH - 50, 180, 38, "#166534", "#fff", "RESUME", () => {
                closeSkillTree();
            });
        }

        function drawMilestoneRewardScreen() {
            drawGameScene();
            ctx.fillStyle = "rgba(9, 9, 14, 0.88)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const modalW = 1000, modalH = 350;
            const mx = (canvas.width - modalW) / 2, my = (canvas.height - modalH) / 2;
            ctx.fillStyle = "#1e1b18";
            ctx.fillRect(mx, my, modalW, modalH);
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 3;
            ctx.strokeRect(mx, my, modalW, modalH);

            ctx.textAlign = "center";
            ctx.fillStyle = "#d4af37";
            ctx.font = "bold 30px Georgia, serif";
            ctx.fillText("MILESTONE REWARD", canvas.width / 2, my + 48);
            ctx.fillStyle = "#cbd5e1";
            ctx.font = "15px Georgia, serif";
            ctx.fillText("Choose one reward", canvas.width / 2, my + 78);

            const cardY = my + 105, cardW = 290, cardH = 205, gap = 20;
            const rewards = [
                sidekickUnlocked
                    ? { id: "mapSize", title: "EXPAND THE MAP", description: ["Increase map width and height", "by 25%; enemy spawns +25%."] }
                    : { id: "sidekick", title: "ROYAL SIDEKICK", description: ["Fires a copy of each spell", "whenever you cast it."] },
                { id: "gold", title: "1,000 GOLD", description: ["Add 1,000 gold to your", "treasury immediately."] },
                { id: "shield", title: "PROJECTILE SHIELD", description: ["Blocks damage from enemy", "projectiles and boulders."] }
            ];
            rewards.forEach((reward, index) => {
                const cardX = mx + 35 + index * (cardW + gap);
                ctx.fillStyle = "#29231d";
                ctx.fillRect(cardX, cardY, cardW, cardH);
                ctx.strokeStyle = "#8b6b27";
                ctx.lineWidth = 1;
                ctx.strokeRect(cardX, cardY, cardW, cardH);
                ctx.fillStyle = "#fef3c7";
                ctx.font = "bold 16px Georgia, serif";
                ctx.fillText(reward.title, cardX + cardW / 2, cardY + 38);
                ctx.fillStyle = "#cbd5e1";
                ctx.font = "13px Georgia, serif";
                reward.description.forEach((line, lineIndex) => {
                    ctx.fillText(line, cardX + cardW / 2, cardY + 75 + lineIndex * 20);
                });
                drawButton(cardX + 45, cardY + 140, cardW - 90, 42, "#5c4033", "#fff", "CHOOSE", () => {
                    chooseMilestoneReward(reward.id);
                });
            });
        }

        function drawPauseScreen() {
            ctx.fillStyle = "rgba(9, 9, 14, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let modalW = 450, modalH = 480;
            let mx = (canvas.width - modalW) / 2, my = (canvas.height - modalH) / 2;

            ctx.fillStyle = "#1e1b18"; ctx.fillRect(mx, my, modalW, modalH);
            ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 3; ctx.strokeRect(mx, my, modalW, modalH);

            ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "bold 32px Georgia, serif";
            ctx.fillText("REALM PAUSED", canvas.width / 2, my + 60);

            drawButton(canvas.width / 2 - 100, my + 100, 200, 45, "#5c4033", "#fff", "RESUME", () => gameState = 'PLAYING');
            drawButton(canvas.width / 2 - 100, my + 160, 200, 45, "#991b1b", "#fff", "RESTART GAME", () => startNewGame());
            drawButton(canvas.width / 2 - 100, my + 220, 200, 45, "#4e3d2a", "#fff", "CONTROLS",
                () => openControlsMenu('PAUSED'));
            drawButton(canvas.width / 2 - 100, my + 280, 200, 45, "#3f3224", "#fff", "AUDIO SETTINGS",
                () => openAudioSettings('PAUSED'));
            drawButton(canvas.width / 2 - 100, my + 340, 200, 45, "#166534", "#fff",
                communityUser ? "SIGN OUT" : "LOG IN", handleAccountButton);
            drawButton(canvas.width / 2 - 100, my + 400, 200, 45, "#3f3224", "#fff", "MAIN MENU", () => gameState = 'MENU');
        }

        function drawEndScreen(title, subtitle, btnText, callback) {
            ctx.fillStyle = "rgba(9, 9, 14, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = "center";
            ctx.fillStyle = title.includes("VICTORY") ? "#22c55e" : "#ef4444";
            ctx.font = "bold 45px Georgia, serif"; ctx.fillText(title, canvas.width / 2, 220);
            ctx.fillStyle = "#cbd5e1"; ctx.font = "20px Georgia, serif";
            ctx.fillText(subtitle, canvas.width / 2, 280);
            ctx.fillText(`Final Score: ${score} | Gold: 🪙 ${player.gold}`, canvas.width / 2, 320);
            ctx.fillText(`Time: ${formatElapsedTime(runElapsedMs)}`, canvas.width / 2, 355);
            drawButton(canvas.width / 2 - 100, 390, 200, 50, "#5c4033", "#fff", btnText, callback);
        }

        function drawButton(x, y, w, h, bgColor, textColor, text, onClick) {
            let isHovered = mouse.x > x && mouse.x < x + w && mouse.y > y && mouse.y < y + h;
            ctx.fillStyle = isHovered ? "#7a523e" : bgColor;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = textColor; ctx.font = "bold 15px Georgia, serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, x + w / 2, y + h / 2);
            ctx.textBaseline = "alphabetic";
            if (mouse.clicked && isHovered) {
                playSoundEffect(520, 0.07, 0.055, "triangle");
                onClick();
            }
        }

        let previousFrameTime = null;
        let fpsSampleStart = null;
        let fpsFrameCount = 0;
        let fps = 0;
        function loop(timestamp) {
            const deltaTime = previousFrameTime === null ? 0 : timestamp - previousFrameTime;
            previousFrameTime = timestamp;
            if (runTimerActive) {
                if (gameState === 'MENU' || gameState === 'GAMEOVER' || gameState === 'VICTORY') {
                    runTimerActive = false;
                } else {
                    runElapsedMs += deltaTime;
                }
            }
            updateMusic();
            fpsFrameCount++;
            if (fpsSampleStart === null) fpsSampleStart = timestamp;
            if (timestamp - fpsSampleStart >= 500) {
                fps = Math.round(fpsFrameCount * 1000 / (timestamp - fpsSampleStart));
                fpsFrameCount = 0;
                fpsSampleStart = timestamp;
            }

            if (gameState === 'MENU') {
                drawMenu();
            } else if (gameState === 'CONTROLS') {
                drawControlsMenu();
            } else if (gameState === 'DIFFICULTY') {
                drawDifficultyMenu();
            } else if (gameState === 'AUDIO') {
                drawAudioSettings();
            } else if (gameState === 'PLAYING') {
                if (!showBuildModal) updateGame(deltaTime);
                drawGameScene();
            } else if (gameState === 'INTERMISSION') {
                // Auto-pauses gameplay updates during intermission screen
                drawIntermissionScreen();
                if (showBuildModal) drawBuildModal();
            } else if (gameState === 'PAUSED') {
                drawGameScene();
                drawPauseScreen();
            } else if (gameState === 'SKILLTREE') {
                // Auto-pauses gameplay updates while skill tree is open
                drawGameScene();
                drawSkillTree();
            } else if (gameState === 'MILESTONE_REWARD') {
                drawMilestoneRewardScreen();
            } else if (gameState === 'GAMEOVER') {
                drawEndScreen("DEFEAT", "Your crown was seized by the rival kingdom.", "TRY AGAIN", () => startNewGame());
                drawButton(canvas.width / 2 - 100, 490, 200, 50, "#5c4033", "#fff", "RETURN TO MENU", () => gameState = 'MENU');
            } else if (gameState === 'VICTORY') {
                drawEndScreen("VICTORY!", "You successfully crushed the rival kingdom and united the realm!", "PLAY AGAIN", () => startNewGame());
                drawButton(canvas.width / 2 - 100, 700, 200, 50, "#5c4033", "#fff", "RETURN TO MENU", () => gameState = 'MENU');
            }

            // If build modal is toggled open during gameplay, pause background game updates
            if (showBuildModal && gameState === 'PLAYING') {
                drawGameScene(); // draws scene and build modal on top without updating game enemies/player position
            }

            syncCommunitySidebar();
            ctx.fillStyle = "rgba(9, 9, 14, 0.75)";
            ctx.fillRect(canvas.width - 105, 12, 88, 30);
            ctx.fillStyle = "#f3f4f6";
            ctx.font = "15px Georgia, serif";
            ctx.textAlign = "right";
            ctx.fillText(`FPS: ${fps}`, canvas.width - 25, 32);
            ctx.textAlign = "left";

            mouse.clicked = false;
            requestAnimationFrame(loop);
        }

        initializeCommunity();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
