<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellbound - King's Realm</title>
    <style>
        body {
            margin: 0;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #2cc7dc;
            font-family: 'Georgia', serif;
            flex-direction: column;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            border: 4px solid #000000;
            background: #33c0d0;
            box-shadow: 0 0 40px rgba(154, 7, 7, 0.9);
            cursor: crosshair;
            display: block;
            max-width: calc(100vw - 16px);
            max-height: calc(100vh - 16px);
            width: auto;
            height: auto;
        }
        #community-panel {
            position: absolute;
            inset: 4px;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 150px 22px 22px;
            background: rgba(9, 9, 14, 0.98);
            color: #e2e8f0;
            font-family: Georgia, serif;
        }
        #community-panel[hidden],
        #community-auth-view[hidden],
        #community-sidebar[hidden],
        .community-section[hidden] {
            display: none;
        }
        #community-auth-card {
            width: min(100%, 900px);
            padding: 22px;
            border: 1px solid #4f936d;
            background: #111318;
        }
        .community-header,
        .community-section-header,
        .community-auth-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .community-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
        }
        .community-header h2,
        .community-section h3 {
            margin: 0;
            color: #d4af37;
        }
        .community-header h2 {
            font-size: 30px;
        }
        .community-header button,
        .community-auth-actions button,
        .community-section button {
            border: 1px solid #d4af37;
            background: #5c4033;
            color: #fff;
            padding: 9px 14px;
            font: bold 14px Georgia, serif;
            cursor: pointer;
        }
        .community-header button:hover,
        .community-auth-actions button:hover,
        .community-section button:hover {
            background: #7a523e;
        }
        #community-auth-view {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
            align-items: end;
            align-content: start;
            align-self: start;
            gap: 10px;
        }
        .community-field {
            display: grid;
            gap: 5px;
            color: #cbd5e1;
            font-size: 13px;
        }
        .community-field input,
        .community-field textarea {
            box-sizing: border-box;
            width: 100%;
            border: 1px solid #64748b;
            background: #18181b;
            color: #fff;
            padding: 10px;
            font: 15px Georgia, serif;
        }
        .community-field textarea {
            min-height: 72px;
            resize: vertical;
        }
        .community-remember {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #cbd5e1;
            font-size: 13px;
        }
        .community-remember input {
            margin: 0;
        }
        .community-auth-actions {
            align-self: end;
        }
        .community-auth-actions button {
            white-space: nowrap;
        }
        #community-status {
            grid-column: 1 / -1;
            min-height: 18px;
            margin: 0;
            color: #fbbf24;
            font-size: 13px;
        }
        #community-sidebar {
            position: absolute;
            inset: 4px;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            box-sizing: border-box;
            pointer-events: none;
            color: #e2e8f0;
            font-family: Georgia, serif;
        }
        .community-sidebar-column {
            width: min(30%, 380px);
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .community-sidebar-toggle {
            align-self: flex-start;
            border: 1px solid #d4af37;
            background: #5c4033;
            color: #fff;
            padding: 8px 11px;
            font: bold 13px Georgia, serif;
            cursor: pointer;
        }
        .community-sidebar-toggle:hover {
            background: #7a523e;
        }
        .community-section {
            min-height: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #4f936d;
            background: rgba(17, 19, 24, 0.96);
            padding: 10px;
        }
        .community-section h3 { font-size: 17px; }
        .community-section-header small {
            color: #94a3b8;
            font-size: 10px;
        }
        .community-section form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .community-section form button {
            align-self: flex-end;
        }
        .community-entry-list {
            min-height: 0;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .community-entry {
            padding: 10px;
            background: #1e1b18;
            border-left: 3px solid #4f936d;
            overflow-wrap: anywhere;
        }
        .community-entry p {
            margin: 0 0 7px;
            white-space: pre-wrap;
        }
        .community-entry small {
            color: #94a3b8;
            font-size: 12px;
        }
        .leaderboard-entry {
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
        }
        .leaderboard-time {
            color: #d4af37;
            font-variant-numeric: tabular-nums;
        }
        .leaderboard-difficulties button {
            border: 1px solid #d4af37;
            background: #5c4033;
            color: #fff;
            font: bold 11px Georgia, serif;
            cursor: pointer;
        }
        .leaderboard-difficulties {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 4px;
        }
        .leaderboard-difficulties button {
            min-width: 0;
            padding: 6px 2px;
        }
        .leaderboard-difficulties button[aria-pressed="true"] {
            background: #166534;
        }
        #leaderboard-content {
            min-height: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        #leaderboard-status,
        .community-sign-in-prompt {
            margin: 0;
            color: #94a3b8;
            font-size: 12px;
        }
        .community-section form[hidden],
        .community-sign-in-prompt[hidden] {
            display: none;
        }
        .community-section .community-field {
            font-size: 12px;
        }
        .community-section .community-field textarea {
            min-height: 52px;
            padding: 7px;
            font-size: 13px;
        }
        .community-section form button {
            padding: 7px 10px;
            font-size: 12px;
        }
        @media (max-width: 700px) {
            #community-panel {
                padding: 90px 12px 12px;
            }
            #community-auth-card {
                padding: 12px;
            }
            #community-auth-view {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .community-auth-actions {
                grid-column: 1 / -1;
            }
            #community-sidebar {
                padding: 6px;
                gap: 6px;
            }
            .community-sidebar-column { width: 36%; }
            .community-sidebar-toggle { padding: 6px; font-size: 11px; }
            .community-section {
                padding: 6px;
                gap: 6px;
            }
            .community-header h2 { font-size: 22px; }
            .community-section h3 { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1520" height="850"></canvas>
        <section id="community-panel" aria-label="Account" hidden>
            <div id="community-auth-card">
                <header class="community-header">
                    <h2>Spellbound Account</h2>
                    <button id="community-close" type="button">Back to Game</button>
                    <p id="community-status" role="status" aria-live="polite">
                        Sign in or create an account to view the community.
                    </p>
                </header>
                <form id="community-auth-view" autocomplete="off">
                    <label class="community-field">
                        Username (for new accounts)
                        <input id="community-username" type="text" minlength="3" maxlength="20"
                            pattern="[A-Za-z0-9_]{3,20}" autocomplete="off" placeholder="RoyalMage_7">
                    </label>
                    <label class="community-field">
                        Email
                        <input id="community-email" type="email" autocomplete="off" required>
                    </label>
                    <label class="community-field">
                        Password
                        <input id="community-password" type="password" minlength="8"
                            autocomplete="off" required>
                    </label>
                    <label class="community-remember">
                        <input id="community-remember-me" type="checkbox">
                        Remember me on this device
                    </label>
                    <div class="community-auth-actions">
                        <button id="community-sign-in" type="submit">Sign In</button>
                        <button id="community-sign-up" type="button">Create Account</button>
                    </div>
                </form>
            </div>
        </section>
        <div id="community-sidebar" aria-label="Community" hidden>
            <div class="community-sidebar-column">
                <button id="leaderboard-toggle" class="community-sidebar-toggle" type="button"
                    aria-expanded="true" aria-controls="leaderboard-section">Hide Leaderboard</button>
                <section id="leaderboard-section" class="community-section" aria-label="Rounds mode leaderboard">
                    <div class="community-section-header">
                        <h3>Rounds Leaderboard</h3>
                    </div>
                    <div id="leaderboard-content">
                        <div class="leaderboard-difficulties" aria-label="Leaderboard difficulty">
                            <button type="button" data-leaderboard-difficulty="easy"
                                aria-pressed="false">Easy</button>
                            <button type="button" data-leaderboard-difficulty="normal"
                                aria-pressed="true">Normal</button>
                            <button type="button" data-leaderboard-difficulty="hard"
                                aria-pressed="false">Hard</button>
                            <button type="button" data-leaderboard-difficulty="extreme"
                                aria-pressed="false">Extreme</button>
                            <button type="button" data-leaderboard-difficulty="impossible"
                                aria-pressed="false">Impossible</button>
                        </div>
                        <p id="leaderboard-status" role="status" aria-live="polite">Loading scores...</p>
                        <div id="leaderboard-list" class="community-entry-list" aria-live="polite"></div>
                    </div>
                </section>
            </div>
            <div class="community-sidebar-column">
                <button id="community-posts-toggle" class="community-sidebar-toggle"
                    type="button" aria-expanded="true" aria-controls="community-posts-section">
                    Hide Posts
                </button>
                <section id="community-posts-section" class="community-section" aria-label="Community posts">
                    <div class="community-section-header">
                        <h3>Community Posts</h3>
                        <small id="community-account"></small>
                    </div>
                    <p id="community-posts-sign-in" class="community-entry community-sign-in-prompt" hidden>
                        Sign in to browse and publish community posts.
                    </p>
                    <form id="community-post-form">
                        <label class="community-field">
                            Share with the community
                            <textarea id="community-post-input" maxlength="1000" required
                                placeholder="Write a post (up to 1,000 characters)"></textarea>
                        </label>
                        <button type="submit">Publish Post</button>
                    </form>
                    <div id="community-post-list" class="community-entry-list" aria-live="polite"></div>
                </section>
                <button id="community-chat-toggle" class="community-sidebar-toggle"
                    type="button" aria-expanded="true" aria-controls="community-chat-section">
                    Hide Chat
                </button>
                <section id="community-chat-section" class="community-section" aria-label="Community chat">
                    <div class="community-section-header">
                        <h3>Live Chat</h3>
                    </div>
                    <div id="community-chat-list" class="community-entry-list" aria-live="polite"></div>
                    <p id="community-chat-sign-in" class="community-entry community-sign-in-prompt" hidden>
                        Sign in to read and send live chat messages.
                    </p>
                    <form id="community-chat-form">
                        <label class="community-field">
                            Message
                            <textarea id="community-chat-input" maxlength="500" required
                                placeholder="Say hello (up to 500 characters)"></textarea>
                        </label>
                        <button type="submit">Send Message</button>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script>

        const ctx = canvas.getContext("2d");
        const initialMapWidth = canvas.width;
        const initialMapHeight = canvas.height;
        const mapExpansionFactor = 1.25;
        let mapExpansionLevel = 0;

        let gameState = 'MENU'; // 'MENU', 'CONTROLS', 'DIFFICULTY', 'AUDIO', 'PLAYING', 'PAUSED', 'INTERMISSION', 'SKILLTREE', 'MILESTONE_REWARD', 'GAMEOVER', 'VICTORY'

        let gameMode = 'Rounds';
        let arcadeElapsedMs = 0;

        let milestoneRewardClaimed = false;
        let milestoneRewardResumeState = 'PLAYING';
        let sidekickUnlocked = false;
        const projectileShieldDurationMs = 60 * 1000;
        const enemyContactDamageIntervalMs = 1000;
        const enemyKillGoldRewards = {

            berserker: 25,
            crossbow: 10,
            archer: 5,
            scout: 2,
            knight: 50,
            gasser: 25,
            smurf: 25,
            troll:25,
            alien: 75,
            thanos: 75,
            ultron: 100,
            champion: 200,
            king: 1000,
         };
        let projectileShieldRemainingMs = 0;
        const spellBurstDelayMs = 120;
        let pendingPlayerShots = [];
        const arcadeKingIntervalMs = 6 * 60 * 1000;
        const arcadeChampionIntervalMs = 3 * 60 * 1000;
        let arcadeNextKingMs = arcadeKingIntervalMs;
        let arcadeNextChampionMs = arcadeChampionIntervalMs;
        let arcadeNextMilestoneRewardMs = arcadeChampionIntervalMs;
        const difficultySettings = {
            easy: { enemyHealth: 0.5, enemySpeed: 0.65, enemyDamage: 0.7, waveSize: 0.8, maxRounds: 10 },
            normal: { enemyHealth: 1, enemySpeed: 1, enemyDamage: 1, waveSize: 1, maxRounds: 20 },

            impossible: { enemyHealth: 4, enemySpeed: 3, enemyDamage: 7, waveSize: 4, maxRounds: 100 }
        };
        let showBuildModal = false;
        let intermissionFrames = 30 * 60;
        let waitingForKeyRebind = null;

        const controlDefinitions = [
            { key: 'up', label: "Move Up", defaultKey: 'w' },
            { key: 'left', label: "Move Left", defaultKey: 'a' },
            { key: 'down', label: "Move Down", defaultKey: 's' },
            { key: 'right', label: "Move Right", defaultKey: 'd' },
            { key: 'spell1', label: "Spell 1 (Fire)", defaultKey: '1' },
            { key: 'spell2', label: "Spell 2 (Frost)", defaultKey: '2' },
            { key: 'spell3', label: "Spell 3 (Bolt)", defaultKey: '3' },
            { key: 'spell4', label: "Spell 4 (Arcane)", defaultKey: '4' },
            { key: 'spell5', label: "Spell 5 (Doom)", defaultKey: '5' },
            { key: 'pause', label: "Pause / Play", defaultKey: 'p' },
            { key: 'build', label: "Build Menu", defaultKey: 'b' },
            { key: 'skilltree', label: "Skill Tree", defaultKey: 't' },
            { key: 'fullscreen', label: "Toggle Fullscreen", defaultKey: 'f' }
        ];
        let keybinds = Object.fromEntries(controlDefinitions.map(({ key, defaultKey }) => [key, defaultKey]));
        let keybindsRevision = 0;
        let keybindSaveTimer = null;
        let keybindSavePromise = Promise.resolve();

        const keys = {};
        const mouse = { x: 0, y: 0, down: false, clicked: false };
        function getCanvasPosition(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * canvas.width / rect.width,
                y: (clientY - rect.top) * canvas.height / rect.height
            };
        }
        let placementClick = false;
        let skillTreeScrollY = 0;
        let skillTreeScrollDragging = false;
        let skillTreeScrollDragOffset = 0;
        let controlsScrollY = 0;
        let controlsScrollDragging = false;
        let controlsScrollDragOffset = 0;
        let controlsReturnState = 'MENU';
        let audioReturnState = 'MENU';

        let musicContext = null;
        let musicMaster = null;
        let soundEffectsMaster = null;
        let musicTimer = null;
        let musicMode = null;
        let musicStep = 0;
        let musicEnabled = true;
        let soundEffectsEnabled = true;
        let musicVolume = 0.70;
        let soundEffectsVolume = 0.70;
        const musicNoteDurationMultiplier = 1.0; // Increase this value to sustain music notes longer.
        const supabaseUrl = "https://fzlizzhrpfhzmimqrxpd.supabase.co";
        const supabaseAnonKey = "sb_publishable_KSfChlgp-1rkC1sly5fXzQ_U2E7R10g";
        const communityRememberPreferenceKey = "spellbound-community-remember";
        let communityClient = null;
        let communityClientPromise = null;
        let communityClientRememberDevice = false;
        let communityInitializationPromise = null;
        let communityChannel = null;
        let communityUser = null;
        const musicTracks = {
            menu: [
                { tempo: 360, wave: "triangle", volume: 0.04,
                  notes: [220,261.63,329.63,440,392,329.63,261.63,246.94,220,220,246.94,261.63,329.63,293.66,261.63,246.94,196,0],                 bass: [110,98,87.31,82.41] }
            ],
            fight: [

                { tempo: 240, wave: "square", volume: 0.035,
                  notes: [233.08,233.08,277.18,233.08,311.13,277.18,233.08,207.65,233.08,349.23,311.13,277.18,233.08,207.65,185,207.65,0,],
                  bass: [116.54,116.54,103.83,92.5] }
            ],
            boss: [
                { tempo: 185, wave: "sawtooth", volume: 0.045,
                  notes: [174.61,174.61,207.65,174.61,261.63,246.94,207.65,196,174.61,174.61,233.08,207.65,277.18,261.63,233.08,207.65,0],
                  bass: [87.31,87.31,82.41,77.78] }
            ],
            victory: [
                { tempo: 240, wave: "triangle", volume: 0.05,
                  notes: [261.63,329.63,392,523.25,493.88,392,329.63,261.63,293.66,369.99,440,587.33,523.25,440,392,329.63,0],
                  bass: [130.81,146.83,164.81,196] }
            ],
            defeat: [
                { tempo: 320, wave: "triangle", volume: 0.045,
                  notes: [196,185,174.61,164.81,155.56,146.83,130.81,116.54,130.81,116.54,110,98,110,98,87.31,82.41,0],
                  bass: [98,92.5,87.31,82.41] }
            ]
        };

        function ensureMusicStarted() {
            if (!musicContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                musicContext = new AudioContextClass();
                musicMaster = musicContext.createGain();
                musicMaster.gain.value = musicVolume;
                musicMaster.connect(musicContext.destination);
                soundEffectsMaster = musicContext.createGain();
                soundEffectsMaster.gain.value = soundEffectsVolume;
                soundEffectsMaster.connect(musicContext.destination);
            }
            if (musicContext.state === "suspended") musicContext.resume();
        }

        function playSoundEffect(frequency = 440, duration = 0.08, volume = 0.08, wave = "sine") {
            if (!soundEffectsEnabled) return;
            ensureMusicStarted();
            if (!musicContext || !soundEffectsMaster) return;
            scheduleMusicNote(frequency, duration, volume, wave, "effects");
        }

        function scheduleMusicNote(frequency, duration, volume, wave, bus = "music") {
            const destination = bus === "effects" ? soundEffectsMaster : musicMaster;
            if (!musicContext || !destination) return;

            const start = musicContext.currentTime;
            const oscillator = musicContext.createOscillator();
            const gain = musicContext.createGain();
            oscillator.type = wave;
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
            oscillator.connect(gain);
            gain.connect(destination);
            oscillator.start(start);
            oscillator.stop(start + duration + 0.02);
        }

        function startMusicTrack(mode) {
            if (!musicEnabled) return;

            const tracks = musicTracks[mode] || musicTracks.menu;
            const track = tracks[0];
            const musicDuration = (duration) => duration * musicNoteDurationMultiplier;
            musicStep = 0;
            if (musicTimer) clearInterval(musicTimer);

            const playStep = () => {
                if (!musicContext) return;
                const note = track.notes[musicStep % track.notes.length];
                scheduleMusicNote(note, musicDuration(Math.min(track.tempo / 1000 * 0.72, 0.22)), track.volume, track.wave);

                if (musicStep % 4 === 0) {
                    const bassIndex = Math.floor(musicStep / 4) % track.bass.length;
                    scheduleMusicNote(track.bass[bassIndex],
                        musicDuration(track.tempo / 1000 * 1.8), track.volume * 0.9,
                        mode === "boss" ? "triangle" : "triangle");
                }

                if (mode === "menu") {
                    if (musicStep % 4 === 0) {
                        scheduleMusicNote(note * 2, musicDuration(track.tempo / 1000 * 1.4),
                            track.volume * 0.55, "sine");
                    }
                    if (musicStep % 8 === 6) {
                        scheduleMusicNote(note * 1.5, musicDuration(track.tempo / 1000 * 0.9),
                            track.volume * 0.45, "sine");
                    }
                } else if (mode === "fight") {
                    if (musicStep % 2 === 0) {
                        scheduleMusicNote(note * 1.5, musicDuration(track.tempo / 1000 * 0.28),
                            track.volume * 0.35, "square");
                    }
                    if (musicStep % 4 === 1) {
                        scheduleMusicNote(41.2, 0.08, track.volume * 0.8, "sawtooth");
                    }
                } else if (mode === "boss") {
                    if (musicStep % 2 === 0) {
                        scheduleMusicNote(note * 2, musicDuration(track.tempo / 1000 * 0.38),
                            track.volume * 0.38, "triangle");
                    }
                    if (musicStep % 8 === 7) {
                        scheduleMusicNote(track.bass[Math.floor(musicStep / 8) % track.bass.length] * 2,
                            musicDuration(track.tempo / 1000 * 1.2), track.volume * 0.55, "square");
                    }
                } else if (mode === "victory") {
                    if (musicStep % 4 === 2) {
                        scheduleMusicNote(note * 2, musicDuration(track.tempo / 1000 * 1.2),
                            track.volume * 0.5, "sine");
                    }
                } else if (mode === "defeat") {
                    if (musicStep % 4 === 3) {
                        scheduleMusicNote(note * 0.5, musicDuration(track.tempo / 1000 * 1.4),
                            track.volume * 0.45, "triangle");
                    }
                }
                musicStep++;

                if (musicStep >= track.notes.length) {
                    clearInterval(musicTimer);
                    musicTimer = null;
                    startMusicTrack(mode);
                }
            };

            playStep();
            musicTimer = setInterval(playStep, track.tempo);
            if (musicContext.state === "suspended") {
                musicContext.resume();
            }
        }

        function setMusicMode(mode) {
            ensureMusicStarted();
            if (!musicEnabled) {
                if (musicTimer) clearInterval(musicTimer);
                musicTimer = null;
                musicMode = null;
                return;
            }
            if (musicMode === mode) return;
            musicMode = mode;
            startMusicTrack(mode);
        }

        function getActiveMusicMode() {
            const gameplayStates = new Set(["PLAYING", "PAUSED", "INTERMISSION", "SKILLTREE", "MILESTONE_REWARD"]);
            if (gameState === "VICTORY") return "victory";
            if (gameState === "GAMEOVER") return "defeat";
            if (gameState === "AUDIO") {
                if (audioReturnState === "PAUSED") {
                    if (enemies.some(enemy => enemy.model === "king" || enemy.model === "champion")) return "boss";
                    return "fight";
                }
                return "menu";
            }
            if (gameplayStates.has(gameState) &&
                enemies.some(enemy => enemy.model === "king" || enemy.model === "champion")) {
                return "boss";
            }
            if (gameplayStates.has(gameState)) return "fight";
            return "menu";
        }

        function updateMusic() {
            setMusicMode(getActiveMusicMode());
        }

        function setCommunityStatus(message) {

        function formatElapsedTime(milliseconds) {
            const centiseconds = Math.floor(milliseconds / 10);
            const totalSeconds = Math.floor(centiseconds / 100);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const fraction = centiseconds % 100;
            return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(fraction).padStart(2, "0")}`;
        }

        function isLeaderboardRun() {
            return gameMode === "Rounds";

        async function loadLeaderboard(leaderboardDifficulty = selectedLeaderboardDifficulty) {
            const client = await getCommunityClient();
            const { data, error } = await client
                .from("normal_mode_leaderboard")
                .select("username, best_time_ms")
                .eq("difficulty", leaderboardDifficulty)
                .order("best_time_ms", { ascending: true })
                .order("updated_at", { ascending: true })
                .limit(10);
            if (error) throw error;
            if (leaderboardDifficulty !== selectedLeaderboardDifficulty) return;

            const list = document.getElementById("leaderboard-list");
            list.replaceChildren();
            if (!data?.length) {
                const emptyMessage = document.createElement("p");
                emptyMessage.textContent = "No victories recorded yet.";
                list.appendChild(emptyMessage);
            } else {
                data.forEach((entry, index) => {
                    const row = document.createElement("article");
                    row.className = "community-entry leaderboard-entry";

                    const rank = document.createElement("strong");
                    rank.textContent = `${index + 1}.`;
                    const username = document.createElement("span");
                    username.textContent = entry.username;
                    const time = document.createElement("strong");
                    time.className = "leaderboard-time";
                    time.textContent = formatElapsedTime(Number(entry.best_time_ms));

                    row.append(rank, username, time);
                    list.appendChild(row);

            const difficultyLabel = leaderboardDifficulty[0].toUpperCase() + leaderboardDifficulty.slice(1);
            setLeaderboardStatus(communityUser
                ? `Personal bests · ${difficultyLabel} difficulty`

        async function submitLeaderboardTime(completionTimeMs, runDifficulty) {
            if (communityInitializationPromise) {
                await communityInitializationPromise;
            } else if (!communityClient) {
                await initializeCommunity();
            }
            if (!communityUser) {
                setLeaderboardStatus("Sign in before a victory to submit your time.");
                return;
            }

            const client = await getCommunityClient();
            const userId = communityUser.id;
            const { data: existing, error: lookupError } = await client
                .from("normal_mode_leaderboard")
                .select("best_time_ms")
                .eq("user_id", userId)
                .eq("difficulty", runDifficulty)
                .maybeSingle();
            if (lookupError) throw lookupError;
            if (existing && Number(existing.best_time_ms) <= completionTimeMs) {
                setLeaderboardStatus("Your existing leaderboard time is faster.");
                return;
            }

            const username = String(
                communityUser.user_metadata?.username || communityUser.email?.split("@")[0] || "Player"
            ).slice(0, 30);
            setLeaderboardStatus("Saving your victory time...");
            const { error } = await client.from("normal_mode_leaderboard").upsert({
                user_id: userId,
                difficulty: runDifficulty,
                username,
                best_time_ms: completionTimeMs,
                updated_at: new Date().toISOString()
            }, { onConflict: "user_id,difficulty" });
            if (error) throw error;

            setLeaderboardDifficulty(runDifficulty);
            await loadLeaderboard(runDifficulty);
            setLeaderboardStatus("Your personal best was saved.");
        }

        async function getCommunityClient(rememberDevice =
            localStorage.getItem(communityRememberPreferenceKey) === "true") {
            if (supabaseUrl.includes("YOUR_PROJECT_ID") ||
                supabaseAnonKey.includes("YOUR_SUPABASE_ANON_KEY")) {
                throw new Error("Set the Supabase project URL and anon key in game.html, then run supabase-schema.sql.");
            }
            if (communityClientPromise && communityClientRememberDevice !== rememberDevice) {
                await communityClientPromise;
            }
            if (communityClient && communityClientRememberDevice !== rememberDevice) {
                communityClient = null;
                communityClientPromise = null;
            }
            if (communityClient) return communityClient;
            if (!communityClientPromise) {
                communityClientRememberDevice = rememberDevice;
                communityClientPromise = (async () => {
                    if (!window.supabase?.createClient) {
                        await new Promise((resolve, reject) => {
                            const script = document.createElement("script");
                            script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
                            script.onload = resolve;
                            script.onerror = () => reject(new Error("Could not load the Supabase client library."));
                            document.head.appendChild(script);
                        });
                    }
                    if (!window.supabase?.createClient) {
                        throw new Error("The Supabase client library did not initialize.");
                    }
                    communityClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
                        auth: {
                            storage: rememberDevice ? window.localStorage : window.sessionStorage
                        }
                    });
                    communityClient.auth.onAuthStateChange((_event, session) => {
                        window.setTimeout(() => setCommunityUser(session?.user || null), 0);
                    });
                    return communityClient;
                })().catch((error) => {
                    communityClientPromise = null;
                    throw error;
                });
            }
            return communityClientPromise;
        }

        function initializeCommunity() {
            if (communityInitializationPromise) return communityInitializationPromise;
            setCommunityStatus("Connecting to the community...");
            communityInitializationPromise = (async () => {
                try {
                    const client = await getCommunityClient();
                    const { data, error } = await client.auth.getSession();
                    if (error) throw error;
                    setCommunityUser(data.session?.user || null);
                    loadLeaderboard().catch(showLeaderboardError);
                } catch (error) {
                    showCommunityError(error);
                    showLeaderboardError(error);
                } finally {
                    communityInitializationPromise = null;
                }
            })();
            return communityInitializationPromise;
        }

        function connectCommunityFeed() {
            if (!communityClient || communityChannel) return;
            communityChannel = communityClient.channel("spellbound-community-feed")
                .on("postgres_changes", {
                    event: "INSERT",
                    schema: "public",
                    table: "community_posts"
                }, () => loadCommunityPosts().catch(showCommunityError))
                .on("postgres_changes", {
                    event: "INSERT",
                    schema: "public",
                    table: "community_messages"
                }, () => loadCommunityMessages().catch(showCommunityError))
                .subscribe((status) => {
                    if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
                        setCommunityStatus(`Live updates unavailable (${status}). Refresh the page to retry.`);
                    }
                });
        }

        async function loadCommunityPosts() {
            const userId = communityUser?.id;
            if (!userId) return;
            const { data, error } = await communityClient
                .from("community_posts")
                .select("id, body, created_at, profiles!community_posts_user_id_fkey(username)")
                .order("created_at", { ascending: false })
                .limit(100);
            if (error) throw error;
            if (communityUser?.id !== userId) return;
            renderCommunityEntries("community-post-list", data);
        }

        async function loadCommunityMessages() {
            const userId = communityUser?.id;
            if (!userId) return;
            const { data, error } = await communityClient
                .from("community_messages")
                .select("id, body, created_at, profiles!community_messages_user_id_fkey(username)")
                .order("created_at", { ascending: false })
                .limit(100);
            if (error) throw error;
            if (communityUser?.id !== userId) return;
            renderCommunityEntries("community-chat-list", data.reverse());

        window.addEventListener("pointerdown", ensureMusicStarted, { passive: true });

        const skillTierSettings = {
            1: { name: "TIER 1", unlockCost: 0 },

            3: { name: "TIER 3", unlockCost: 30000 }
        };
        let unlockedSkillTiers = { 1: true, 2: false, 3: false };
        let selectedSkillTier = 1;
        let skillTreeReturnState = 'PLAYING';

        function isTextEntryTarget(target) {
            return target instanceof HTMLElement &&
                (target.isContentEditable || target.matches("input, textarea, select"));
        }

        window.addEventListener("keydown", (e) => {
            if (isTextEntryTarget(e.target) && e.key !== "Escape") return;
            let keyLower = e.key.toLowerCase();

            if (e.key === "Escape") {
                if (waitingForKeyRebind === 'fullscreen') {
                    keybinds.fullscreen = keyLower;
                    keybindsRevision++;
                    schedulePlayerControlsSave();
                    waitingForKeyRebind = null;
                } else if (waitingForKeyRebind) {
                    waitingForKeyRebind = null;
                } else if (communityOpen) {
                    closeCommunity();
                } else if (gameState === 'CONTROLS') {
                    gameState = controlsReturnState;
                } else if (gameState === 'AUDIO') {
                    gameState = audioReturnState;
                } else if (keybinds.fullscreen === keyLower && !document.fullscreenElement) {
                    toggleFullscreen();
                }
                return;
            }

            if (waitingForKeyRebind) {
                keybinds[waitingForKeyRebind] = keyLower;
                keybindsRevision++;
                schedulePlayerControlsSave();
                waitingForKeyRebind = null;
                return;
            }

            if (keyLower === keybinds.fullscreen) {
                toggleFullscreen();
            } else if (keyLower === keybinds.pause && (gameState === 'PLAYING' || gameState === 'PAUSED')) {
                togglePause();
            } else if (keyLower === keybinds.build && (gameState === 'PLAYING' || gameState === 'INTERMISSION')) {
                showBuildModal = !showBuildModal;
            } else if (keyLower === keybinds.skilltree && (gameState === 'PLAYING' || gameState === 'INTERMISSION')) {
                openSkillShop();
            }

            keys[keyLower] = true;
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener("mousemove", (e) => {
            const position = getCanvasPosition(e.clientX, e.clientY);
            mouse.x = position.x;
            mouse.y = position.y;
            if (skillTreeScrollDragging && mouse.down) {
                const layout = getSkillTreeLayout();
                const thumbRange = layout.track.height - layout.thumbHeight;
                const thumbY = Math.max(layout.track.y, Math.min(layout.track.y + thumbRange, mouse.y - skillTreeScrollDragOffset));
                skillTreeScrollY = thumbRange > 0
                    ? ((thumbY - layout.track.y) / thumbRange) * layout.maxScroll
                    : 0;
            }
            if (controlsScrollDragging && mouse.down) {
                const layout = getControlsMenuLayout();
                const thumbRange = layout.track.height - layout.thumbHeight;
                const thumbY = Math.max(layout.track.y, Math.min(
                    layout.track.y + thumbRange,
                    mouse.y - controlsScrollDragOffset
                ));
                controlsScrollY = thumbRange > 0
                    ? ((thumbY - layout.track.y) / thumbRange) * layout.maxScroll
                    : 0;
            }
        });
        canvas.addEventListener("mousedown", (e) => {
            const position = getCanvasPosition(e.clientX, e.clientY);
            mouse.x = position.x;
            mouse.y = position.y;
            mouse.down = true;
            mouse.clicked = true;
            placementClick = Boolean(selectedDefenseType && !showBuildModal);
            if (gameState === 'SKILLTREE') {
                const layout = getSkillTreeLayout();
                if (mouse.x >= layout.track.x && mouse.x <= layout.track.x + layout.track.width &&
                    mouse.y >= layout.thumbY && mouse.y <= layout.thumbY + layout.thumbHeight) {
                    skillTreeScrollDragging = true;
                    skillTreeScrollDragOffset = mouse.y - layout.thumbY;
                } else if (mouse.x >= layout.track.x && mouse.x <= layout.track.x + layout.track.width &&
                    mouse.y >= layout.track.y && mouse.y <= layout.track.y + layout.track.height) {
                    const thumbRange = layout.track.height - layout.thumbHeight;
                    skillTreeScrollY = thumbRange > 0
                        ? layout.maxScroll * Math.max(0, Math.min(1,
                            (mouse.y - layout.track.y - layout.thumbHeight / 2) / thumbRange))
                        : 0;
                }
            }
            if (gameState === 'CONTROLS') {
                const layout = getControlsMenuLayout();
                if (layout.maxScroll > 0 &&
                    mouse.x >= layout.track.x && mouse.x <= layout.track.x + layout.track.width &&
                    mouse.y >= layout.thumbY && mouse.y <= layout.thumbY + layout.thumbHeight) {
                    controlsScrollDragging = true;
                    controlsScrollDragOffset = mouse.y - layout.thumbY;
                } else if (layout.maxScroll > 0 &&
                    mouse.x >= layout.track.x && mouse.x <= layout.track.x + layout.track.width &&
                    mouse.y >= layout.track.y && mouse.y <= layout.track.y + layout.track.height) {
                    const thumbRange = layout.track.height - layout.thumbHeight;
                    controlsScrollY = thumbRange > 0
                        ? layout.maxScroll * Math.max(0, Math.min(1,
                            (mouse.y - layout.track.y - layout.thumbHeight / 2) / thumbRange))
                        : 0;
                }
            }
        });

        canvas.addEventListener("mouseup", () => {

        function getRandomArcadeEnemyVariant() {
            const weightedVariants = arcadeEnemyVariants.map(variant => ({
                variant,
                chance: arcadeEnemySpawnChances[variant.model]
            }));
            if (weightedVariants.some(entry => !Number.isFinite(entry.chance) || entry.chance < 0)) {
                throw new Error("Arcade enemy spawn chances must be finite, non-negative numbers.");
            }

            const totalChance = weightedVariants.reduce((total, entry) => total + entry.chance, 0);
            if (totalChance <= 0) {
                throw new Error("At least one Arcade enemy spawn chance must be greater than zero.");
            }

            let roll = Math.random() * totalChance;
            for (const entry of weightedVariants) {
                roll -= entry.chance;
                if (roll < 0) return entry.variant;
            }
            throw new Error("Could not select an Arcade enemy variant from the configured chances.");
        }

            enemies.push(new RivalSoldier({
                hp: 10000, maxHp: 10000, speed: 1.2, radius: 40,
                color: "#1e289d", type: "Rival Champion", model: "champion"
            }));
        }

        class RivalSoldier {
            constructor(data) {
                this.x = 0; this.y = 0;
                const settings = difficultySettings[difficulty];
                const roundStatMultiplier = gameMode === 'Rounds' ? 1 + (currentRound - 1) * 0.05 : 1;
                this.hp = data.hp * settings.enemyHealth * roundStatMultiplier;
                this.maxHp = data.maxHp * settings.enemyHealth * roundStatMultiplier;
                this.speed = (data.speed + (currentRound * 0.05)) * settings.enemySpeed;
                this.baseSpeed = this.speed;
                this.radius = data.radius;
                this.color = data.color;
                this.type = data.type;
                this.model = data.model;
                this.enemySpawnTimerMs = 0;
                this.lastShot = 0;
                this.contactDamageTimerMs = 0;
                this.contactDamage = (enemyContactDamage[this.model] ?? 0.5) *
                    settings.enemyDamage * roundStatMultiplier;

                if (Math.random() < 0.5) {
                    this.x = Math.random() < 0.5 ? 0 : canvas.width;
                    this.y = Math.random() * canvas.height;
                } else {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() < 0.5 ? 0 : canvas.height;
                }
            }

            update(deltaTime) {
                this.speed = this.baseSpeed;

                defenses.forEach(def => {
                    let dist = Math.hypot(this.x - def.x, this.y - def.y);
                    if (def.type === 'bushes' && dist < def.radius + this.radius) {
                        this.speed = this.baseSpeed * 0.5;
                        if (Math.random() < (2 / 60)) this.hp -= 2;
                    } else if (def.type === 'bank' && dist < def.radius + this.radius) {
                        if (!def.broken) {
                            def.enemiesPassed++;
                            if (def.enemiesPassed >= 2) def.broken = true;
                        }
                    }
                });

                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                const distanceToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
                const rangedStats = this.model === 'archer'
                    ? { range: 300, cooldown: 1100, damage: 8, speed: 5, color: "#34d399" }
                    : this.model === 'crossbow'
                        ? { range: 360, cooldown: 1450, damage: 14, speed: 7, color: "#a3e635" }
                        : this.model === 'catapult'
                            ? { range: 440, cooldown: 2400, damage: 22, speed: 4, color: "#f97316", splashRadius: 70 }
                            : this.model === 'siege'
                                ? { range: 500, cooldown: 2600, damage: 28, speed: 4, color: "#60a5fa", splashRadius: 85 }
                                : this.model === 'warMachine'
                                    ? { range: 650, cooldown: 3500, damage: 48, speed: 3.5, color: "#89b819", splashRadius: 140 }
                                    : this.model === 'gasser'
                                        ? { range: 600, cooldown: 5000, damage: 25, speed: 3, color: "#1d85e2", splashRadius: 80 }
                                        : this.model === 'smurf'
                                            ? { range: 550, cooldown: 5000, damage: 25, speed: 3.5, color: "#1d85e2" }
                                            : this.model === 'champion'
                                             ? { range: 600, cooldown: 4000, damage: 60, speed: 3, color: "#facc15", splashRadius: 120 }
                                             : null;

                if (rangedStats && distanceToPlayer <= rangedStats.range) {
                    if (Date.now() - this.lastShot >= rangedStats.cooldown) {
                        this.lastShot = Date.now();
                        projectiles.push({
                            x: this.x, y: this.y,
                            vx: Math.cos(angle) * rangedStats.speed,
                            vy: Math.sin(angle) * rangedStats.speed,
                            speed: rangedStats.speed,
                            targetX: player.x, targetY: player.y,
                            radius: this.model === 'archer' || this.model === 'crossbow' ? 4 : 6,
                            color: rangedStats.color,
                            damage: (rangedStats.damage || 0) * difficultySettings[difficulty].enemyDamage *
                                (gameMode === 'Rounds' ? 1 + (currentRound - 1) * 0.05 : 1),
                            isEnemyProjectile: true,
                            isCatapultBoulder: Boolean(rangedStats.splashRadius) && this.model !== 'gasser',
                            isEnemyGasCanister: this.model === 'gasser',
                            splashRadius: rangedStats.splashRadius,
                            gasDamagePerSecond: (rangedStats.gasDamagePerSecond || 0) *
                                difficultySettings[difficulty].enemyDamage *
                                (gameMode === 'Rounds' ? 1 + (currentRound - 1) * 0.05 : 1)
                        });
                    }
                } else {
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                }

                if (this.model === 'king') {
                    this.enemySpawnTimerMs += deltaTime;
                    while (this.enemySpawnTimerMs >= 2000) {
                        this.enemySpawnTimerMs -= 2000;
                        for (let i = 0; i < Math.ceil(2 * getEnemyCountMultiplier()); i++) {
                            enemies.push(new RivalSoldier(getRandomArcadeEnemyVariant()));
                        }
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.beginPath();
                ctx.arc(0, this.radius * 0.5, this.radius * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fill();

                const r = this.radius;
                const polygon = (points, fill, stroke = "#111827", lineWidth = 2) => {
                    ctx.beginPath();
                    ctx.moveTo(points[0][0], points[0][1]);
                    points.slice(1).forEach(([x, y]) => ctx.lineTo(x, y));
                    ctx.closePath();
                    ctx.fillStyle = fill;
                    ctx.fill();
                    ctx.lineWidth = lineWidth;
                    ctx.strokeStyle = stroke;
                    ctx.stroke();
                };
                const circle = (x, y, radius, fill, stroke = "#111827") => {
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = fill;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = stroke;
                    ctx.stroke();
                };
                const line = (points, color, width = 3) => {
                    ctx.beginPath();
                    ctx.moveTo(points[0][0], points[0][1]);
                    points.slice(1).forEach(([x, y]) => ctx.lineTo(x, y));
                    ctx.strokeStyle = color;
                    ctx.lineWidth = width;
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    ctx.stroke();
                };

                switch (this.model.toLowerCase()) {
                    case "footman":
                        polygon([[-r * 0.65, -r * 0.45], [r * 0.65, -r * 0.45], [r * 0.5, r * 0.7], [-r * 0.5, r * 0.7]], this.color);
                        circle(0, -r * 0.55, r * 0.42, "#fca5a5");
                        polygon([[-r * 0.95, -r * 0.2], [-r * 0.5, -r * 0.5], [-r * 0.45, r * 0.55], [-r * 0.95, r * 0.35]], "#64748b");
                        line([[r * 0.65, -r * 0.6], [r * 0.9, r * 0.6]], "#e2e8f0", 3);
                        break;
                    case "juggernaut":
                        ctx.fillStyle = "#cbd5e1";
                        ctx.fillRect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.5);
                        ctx.strokeStyle = "#475569";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.5);
                        polygon([[-r * 0.45, -r * 0.45], [r * 0.45, -r * 0.45], [r * 0.35, r * 0.15], [-r * 0.35, r * 0.15]], "#334155");
                        line([[-r, -r * 0.6], [-r * 0.7, -r * 0.35], [-r, -r * 0.1]], "#f8fafc", 4);
                        line([[r, -r * 0.6], [r * 0.7, -r * 0.35], [r, -r * 0.1]], "#f8fafc", 4);
                        break;
                    case "warmachine":
                        ctx.fillStyle = "#111827";
                        ctx.fillRect(-r, r * 0.25, r * 2, r * 0.5);
                        circle(-r * 0.6, r * 0.5, r * 0.18, "#9ca3af");
                        circle(0, r * 0.5, r * 0.18, "#9ca3af");

                        ctx.fillStyle = "#d1d5db";
                        ctx.fillRect(r * 0.1, -r * 0.7, r * 1.05, r * 0.18);
                        break;
                    case "siege":
                        ctx.fillStyle = "#111827";
                        ctx.fillRect(-r, r * 0.35, r * 2, r * 0.4);
                        circle(-r * 0.65, r * 0.55, r * 0.2, "#94a3b8");

                        polygon([[-r * 0.75, r * 0.35], [-r * 0.55, -r * 0.15], [r * 0.55, -r * 0.15], [r * 0.75, r * 0.35]], this.color);
                        polygon([[-r * 0.35, -r * 0.1], [r * 0.15, -r * 1.15], [r * 0.45, -r * 0.1]], "#93c5fd");

                    case "catapult":

                        line([[-r * 0.7, -r * 0.4], [-r, r * 0.15], [-r * 0.55, r * 0.1]], "#fecaca", 4);

                        circle(r * 0.16, -r * 0.15, r * 0.09, "#d9f99d", "#d9f99d");
                        ctx.fillStyle = "#365314";

                        circle(r * 0.8, -r * 0.4, r * 0.12, "#bef264");

                        line([[-r * 0.35, r * 0.45], [-r * 0.6, r], [-r * 0.9, r * 1.1]], "#86efac", 3);
                        line([[0, r * 0.55], [0, r * 1.05]], "#86efac", 3);
                        line([[r * 0.35, r * 0.45], [r * 0.6, r], [r * 0.9, r * 1.1]], "#86efac", 3);
                        line([[-r * 0.25, -r * 0.9], [-r * 0.4, -r * 1.25]], "#86efac", 2);
                        line([[r * 0.25, -r * 0.9], [r * 0.4, -r * 1.25]], "#86efac", 2);
                        break;
                    case "thanos":
                        polygon([[-r * 0.75, -r * 0.55], [-r * 0.5, -r], [r * 0.5, -r], [r * 0.75, -r * 0.55], [r * 0.6, r * 0.8], [-r * 0.6, r * 0.8]], this.color);

                        ["#ef4444", "#3b82f6", "#22c55e", "#eab308", "#a855f7"].forEach((gem, index) => {
                            circle(-r * 0.45 + index * r * 0.225, r * 0.25, r * 0.09, gem, "#78350f");
                        });

                    case "ultron":

                        polygon([[-r * 0.45, -r * 0.85], [0, -r * 1.35], [r * 0.45, -r * 0.85], [r * 0.3, -r * 0.55], [-r * 0.3, -r * 0.55]], "#facc15");
                        polygon([[-r, -r * 0.1], [-r * 0.45, -r * 0.35], [-r * 0.4, r * 0.65], [-r, r * 0.45]], "#facc15");

                        break;
                    case "king":
